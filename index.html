<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alya IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* EN-TÊTE */

        header {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            padding: 18px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* ZONE DES MESSAGES */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 80%;
            padding: 13px 16px;
            margin-bottom: 12px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user {
            background: #7c3aed;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .alya {
            background: white;
            color: #222;
            margin-right: auto;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* ZONE D'ÉCRITURE */

        .input-area {
            background: white;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 13px 17px;
            font-size: 16px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #7c3aed;
        }

        #sendButton {
            border: none;
            background: #7c3aed;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        #sendButton:active {
            transform: scale(0.95);
        }

        .typing {
            font-style: italic;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <!-- EN-TÊTE -->

    <header>
        <h1>🤖 Alya IA ❤️</h1>
        <p>Ton assistante personnelle</p>
    </header>


    <!-- MESSAGES -->

    <div id="messages">

        <div class="message alya">
            Coucou 😄❤️ ! Je suis Alya IA.
            Comment puis-je t'aider aujourd'hui ?
        </div>

    </div>


    <!-- ZONE D'ENVOI -->

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Écris un message à Alya..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            ➤
        </button>

    </div>


    <script>

        const messages = document.getElementById("messages");
        const input = document.getElementById("messageInput");


        // Fonction pour envoyer un message

        async function sendMessage() {

            const text = input.value.trim();

            if (text === "") {
                return;
            }


            // Afficher le message de l'utilisateur

            const userMessage = document.createElement("div");

            userMessage.className = "message user";

            userMessage.textContent = text;

            messages.appendChild(userMessage);


            // Vider la zone de texte

            input.value = "";


            // Descendre automatiquement

            messages.scrollTop = messages.scrollHeight;


            // Afficher "Alya réfléchit..."

            const alyaMessage = document.createElement("div");

            alyaMessage.className = "message alya typing";

            alyaMessage.textContent = "Alya réfléchit... 🤔💭";

            messages.appendChild(alyaMessage);

            messages.scrollTop = messages.scrollHeight;


            try {

                // Connexion au serveur Render

                const response = await fetch(
                    "https://alya-ia.onrender.com/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    }
                );


                const data = await response.json();


                // Vérifier la réponse

                if (data.answer) {

                    alyaMessage.classList.remove("typing");

                    alyaMessage.textContent = data.answer;

                } else {

                    alyaMessage.classList.remove("typing");

                    alyaMessage.textContent =
                        "Désolée 😅❤️ Je n'ai pas réussi à répondre.";

                }


            } catch (error) {

                console.error(error);

                alyaMessage.classList.remove("typing");

                alyaMessage.textContent =
                    "Oups 😅❤️ Je n'arrive pas à contacter mon cerveau pour le moment. Vérifie que le serveur est bien disponible.";

            }


            // Descendre automatiquement

            messages.scrollTop = messages.scrollHeight;
        }


        // Envoyer avec la touche Entrée

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        });

    </script>

</body>

</html>
